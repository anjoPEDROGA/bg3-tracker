<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baldur's Gate 3 - Tracker Definitivo</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#161210">
</head>
<body>

    <div class="header">
        <h1>Baldur's Gate 3</h1>
        
        <div class="profile-manager">
            <label for="profile-select">Campanha:</label>
            <select id="profile-select" onchange="switchProfile(this.value)">
                </select>
            <button onclick="createNewProfile()" class="btn-profile-action">+ Nova</button>
            <button onclick="deleteCurrentProfile()" class="btn-profile-action btn-danger">Excluir</button>
        </div>
        
        <div class="controls-panel">
            <input type="text" id="search-input" placeholder="Buscar missão, item, boss, companheiro..." oninput="handleSearchInput()">
            
            <div class="btn-group">
                <button onclick="expandAll()">Expandir Tudo</button>
                <button onclick="collapseAll()">Colapsar Tudo</button>
                <button onclick="jumpToNext()">Próxima Incompleta</button>
            </div>
            
            <div class="btn-group">
                <button onclick="exportSave()" class="btn-export">Exportar Backup (JSON)</button>
                <label for="import-file" class="btn-import">Importar Backup</label>
                <input type="file" id="import-file" accept=".json" onchange="importSave(event)">
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('walkthrough', this)">Diário de Missões</button>
            <button class="tab-btn" onclick="switchTab('loot', this)">Loot / Artefatos</button>
            <button class="tab-btn" onclick="switchTab('builds', this)">Grimório / Builds</button>
        </div>
    </div>

    <div class="container">
        
        <div id="walkthrough" class="tab-content active">
            
            <div class="progress-panel">
                <div class="progress-header">
                    <span class="progress-title">Progresso Total</span>
                    <span id="main-progress-text" class="progress-text">0% (0/0 tarefas)</span>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-fill" id="main-progress-bar"></div>
                </div>
                
                <div class="act-progress-container">
                    <div class="act-row">
                        <span class="act-label">Ato 1</span>
                        <div class="act-bar-bg"><div class="act-bar-fill" id="act1-bar"></div></div>
                        <span class="act-pct" id="act1-text">0%</span>
                    </div>
                    <div class="act-row">
                        <span class="act-label">Ato 2</span>
                        <div class="act-bar-bg"><div class="act-bar-fill" id="act2-bar"></div></div>
                        <span class="act-pct" id="act2-text">0%</span>
                    </div>
                    <div class="act-row">
                        <span class="act-label">Ato 3</span>
                        <div class="act-bar-bg"><div class="act-bar-fill" id="act3-bar"></div></div>
                        <span class="act-pct" id="act3-text">0%</span>
                    </div>
                </div>
            </div>

            <div id="guide-container"></div>
        </div>

        <div id="loot" class="tab-content">
            <div id="loot-container"></div>
        </div>

        <div id="builds" class="tab-content">
            <div id="builds-container"></div>
        </div>

    </div>

    <script src="guideData.js"></script>
    <script src="buildsData.js"></script>
    <script src="lootData.js"></script>
    <script src="app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Registrado!', reg))
            .catch(err => console.log('Erro no Service Worker', err));
        });
      }
    </script>
</body>
</html>
